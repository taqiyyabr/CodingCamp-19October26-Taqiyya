<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A client-side start page with a personalized greeting, focus timer, color-coded to-do list, and quick links.">
  <title>To-do List Life Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Life Dashboard</h1>
    <button id="theme-toggle" type="button" aria-pressed="false">Toggle theme</button>
  </header>

  <main>
    <!-- Greeting Component: time-of-day greeting, live clock, full date, editable user name -->
    <section id="greeting-section" aria-labelledby="greeting-text">
      <h2 id="greeting-text">Good morning</h2>
      <p id="greeting-time">--:-- --</p>
      <p id="greeting-date">--</p>
      <form id="greeting-form">
        <label for="greeting-name-input">Your name</label>
        <input id="greeting-name-input" type="text" maxlength="50" placeholder="Enter your name" autocomplete="name">
        <button type="submit">Save name</button>
      </form>
    </section>

    <!-- Timer Component: 25-minute focus countdown with start/stop/reset and completion indicator -->
    <section id="timer-section" aria-labelledby="timer-heading">
      <h2 id="timer-heading">Focus Timer</h2>
      <p id="timer-display">25:00</p>
      <p id="timer-complete" role="status" aria-live="polite"></p>
      <div class="timer-controls">
        <button id="timer-start" type="button">Start</button>
        <button id="timer-stop" type="button">Stop</button>
        <button id="timer-reset" type="button">Reset</button>
      </div>
    </section>

    <!-- TaskList Component: task input form, color selector, task list, sort action, error status -->
    <section id="task-section" aria-labelledby="task-heading">
      <h2 id="task-heading">To-Do List</h2>
      <form id="task-form">
        <label for="task-text">Task</label>
        <input id="task-text" type="text" maxlength="200" required>
        <label for="task-color">Priority color</label>
        <select id="task-color">
          <option value="red">Red</option>
          <option value="yellow">Yellow</option>
          <option value="green">Green</option>
        </select>
        <button type="submit">Add task</button>
      </form>
      <button id="task-sort" type="button">Sort by color</button>
      <ul id="task-list"></ul>
      <p id="task-error" role="status" aria-live="polite"></p>
    </section>

    <!-- QuickLinks Component: link input form, link list, error status -->
    <section id="link-section" aria-labelledby="link-heading">
      <h2 id="link-heading">Quick Links</h2>
      <form id="link-form">
        <label for="link-label">Label</label>
        <input id="link-label" type="text">
        <label for="link-url">URL</label>
        <input id="link-url" type="url" placeholder="https://example.com">
        <button type="submit">Add link</button>
      </form>
      <ul id="link-list"></ul>
      <p id="link-error" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
